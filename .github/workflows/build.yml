name: ci

# Fast checks on every push and PR. Release builds live in release.yml.
# Private repo minutes are billed with multipliers (Windows x2, macOS x10),
# so CI only type-checks Windows and skips macOS (development happens on a Mac).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Test core
        run: cargo test -p lanlink-core
      - name: Clippy
        run: cargo clippy --workspace --exclude lanlink-app --all-targets -- -D warnings
      - name: Build relay
        run: cargo build -p lanlink-relay

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (app and CLI on Windows)
        run: cargo clippy -p lanlink-app -p lanlink-cli --all-targets -- -D warnings

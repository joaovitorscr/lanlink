name: ci

# Fast checks on every push and PR. Release builds live in release.yml.
# Private repo minutes are billed with multipliers (Windows x2, macOS x10),
# so CI only type-checks Windows and skips macOS (development happens on a Mac).
# Cargo commands use --locked so a stale Cargo.lock fails CI instead of being rewritten.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Test core
        run: cargo test --locked -p lanlink-core
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude lanlink-app --all-targets -- -D warnings
      - name: Build relay
        run: cargo build --locked -p lanlink-relay

  # Known vulnerabilities in dependencies (RustSec). Needs no secrets; see deny.toml.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (app and CLI on Windows)
        run: cargo clippy --locked -p lanlink-app -p lanlink-cli --all-targets -- -D warnings
      # The app's unit tests (update asset selection, checksums, install detection). The app
      # doesn't build on Linux, so they run here.
      - name: Test app
        run: cargo test --locked -p lanlink-app
      - name: Test core
        run: cargo test --locked -p lanlink-core

[package]
name = "lanlink-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lanlink-app"
path = "src/main.rs"

[dependencies]
lanlink-core = { path = "../core" }
gpui = { version = "0.2", features = ["runtime_shaders"] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
open = "5"
serde = { workspace = true }
serde_json = { workspace = true }
# Update check. rustls with ring (already linked by iroh), no OpenSSL or aws-lc.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSGlassEffectView", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[package]
name = "lanlink-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lanlink-app"
path = "src/main.rs"

[dependencies]
lanlink-core = { path = "../core" }
gpui = { version = "0.2", features = ["runtime_shaders"] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
dirs.workspace = true
open = "5"
serde = { workspace = true }
serde_json = { workspace = true }
# Update check. rustls with ring (already linked by iroh), no OpenSSL or aws-lc.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
semver = "1"
gethostname = "1"
# Verifies downloaded updates against the release's SHA256SUMS.
sha2 = "0.10"

auto-launch = "0.6"

# Tray / menu bar icon. Linux is not a GUI target (gpui shaders, no tray backend wired up).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSGlassEffectView", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app", "crates/relay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iroh = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
